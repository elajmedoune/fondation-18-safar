name: Keepalive
on:
  schedule:
    # Toutes les 3 jours à 12h00 UTC (marge confortable avant la pause à 7 jours)
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (activité DB réelle via fn_ping_heartbeat)
        run: curl -sSf https://hdtyltyxugwtbycnnakb.supabase.co/functions/v1/keepalive
